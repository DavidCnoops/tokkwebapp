<div class="{{::vm.styles.container}}">

    <div class="{{::vm.styles.box}}">

        <div class="{{::vm.styles.logo}}">
            <tokk-logo></tokk-logo>
        </div>

        <div class="{{::vm.styles.title}}">
            Forgot your password?
        </div>

        <div class="{{::vm.styles.subtitle}}">
            Don't worry. Just enter your email address below and we'll send you some instructions.
        </div>

        <div class="{{::vm.styles.inputs}}">
            <div>
                <input type="text"
                        class="email {{::vm.styles.input}} {{::vm.styles.first}}" 
                        autocomplete="email" 
                        spellcheck="false" 
                        placeholder="Email" 
                        ng-model="vm.email" 
                        ng-change="vm.resetError()" 
                        tokk-enter="vm.resetPassword(vm.email)" />
            </div>
        </div>

        <tokk-success 
            visible="vm.success" 
            message="vm.successMessage" 
            padding-top="0px" 
            padding-bottom="20px">
        </tokk-success>

        <tokk-error 
            visible="vm.error !== null" 
            message="vm.error.message" 
            padding-top="0px" 
            padding-bottom="20px">
        </tokk-error>

        <div class="{{::vm.styles.button}}" ng-disabled="vm.processing" ng-click="vm.resetPassword(vm.email)">
            <span class="{{::vm.styles.inner}}">
                <span class="{{::vm.styles.text}}" ng-if="!vm.processing">Reset password</span>
                <span ng-if="vm.processing" class="{{::vm.styles.spinner}}">
                    <tokk-spinner size="26px" color="#333" thickness="3px"></tokk-spinner>
                </span>
            </span>
        </div>

        <div class="{{::vm.styles.link}}">
            <a href="/bleh/login">Or try login in</span>
        </div>

    </div>

</div>

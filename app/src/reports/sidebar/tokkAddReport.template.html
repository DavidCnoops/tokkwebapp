<tokk-modal opened="vm.opened" close="vm.close()" width="500px">

	<tokk-modal-header>
		<div class="{{::vm.styles.titleContainer}}">
			<div class="{{::vm.styles.title}}">New report</div>
			<div class="icon-add {{::vm.styles.close}}" ng-click="vm.closeModal()"></div>
		</div>
	</tokk-modal-header>

	<tokk-modal-content>
		<div class="{{::vm.styles.inputContainer}}">
			<tokk-label>Name</tokk-label>
            <tokk-input>
                <input class="{{::vm.styles.input}}" 
                        type="text" 
                        maxlength="256" 
                        placeholder="The name of your report" 
                        ng-model="vm.inputText" 
						tokk-enter="vm.createReport(vm.inputText)" 
                        autocomplete="off">
            </tokk-input>
		</div>
	</tokk-modal-content>

	<tokk-modal-footer>
		<tokk-button 
            class="{{::vm.styles.button}}" 
			text="Create report" 
			type="primary" 
			disabled="!vm.inputText || vm.inputText.length === 0" 
			loading="vm.processing" 
			ng-click="vm.createReport(vm.inputText)">
		</tokk-button>

		<tokk-button 
            text="Cancel" 
            type="secondary" 
			disabled="vm.processing"
            ng-click="vm.closeModal()">
        </tokk-button>
	</tokk-modal-footer>

</tokk-modal>

<tokk-page-section ng-if="vm.loaded">

	<tokk-page-section-header>
		<div class="{{::vm.styles.title}}">Change password</div>
	</tokk-page-section-header>

	<tokk-page-section-content>
		<div class="{{::vm.styles.content}}">
			<div class="{{::vm.styles.line}}">
				<tokk-label>Current password</tokk-label>

				<tokk-input>
					<input type="password" 
							ng-model="vm.currentPassword"
							ng-change="vm.resetError()" />
				</tokk-input>
			</div>

			<div class="{{::vm.styles.line}}">
				<tokk-label>New password</tokk-label>

				<tokk-input>
					<input type="password" 
							ng-model="vm.newPassword"
							ng-change="vm.resetError()" />
				</tokk-input>
			</div>

			<div class="{{::vm.styles.line}}">
				<tokk-label>Confirm new password</tokk-label>

				<tokk-input>
					<input type="password" 
							ng-model="vm.newPasswordConfirmation"
							ng-change="vm.resetError()" 
							tokk-enter="vm.save(vm.email, vm.currentPassword, vm.newPassword, vm.newPasswordConfirmation)"/>
				</tokk-input>
			</div>

			<tokk-error 
				visible="vm.error !== null" 
				message="vm.error.message" 
				padding-top="0px" 
				padding-bottom="15px">
			</tokk-error>

			<tokk-success 
				visible="vm.success" 
				message="vm.successMessage" 
				padding-top="0px" 
				padding-bottom="15px">
			</tokk-success>

			<div class="{{::vm.styles.buttons}}">
				<tokk-button 
					text="Change password" 
					type="primary" 
					loading="vm.processing" 
					ng-click="vm.save(vm.email, vm.currentPassword, vm.newPassword, vm.newPasswordConfirmation)">
				</tokk-button>
			</div>
		</div>
	</tokk-page-section-content>

</tokk-page-section>

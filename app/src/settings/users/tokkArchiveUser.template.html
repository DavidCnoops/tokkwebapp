<span class="icon-archive {{::vm.styles.icon}}" ng-class="{'{{::vm.styles.disabled}}': vm.user.admin}" ng-click="vm.open(vm.user)">
    <tokk-tooltip ng-show="!vm.opened && !vm.user.admin" message="Archive user" vdistance="40px"></tokk-tooltip>
</span>

<tokk-modal class="{{::vm.styles.modal}}" opened="vm.opened" close="vm.close()" width="460px">

	<tokk-modal-header>
		<div class="{{::vm.styles.titleContainer}}">
			<div class="{{::vm.styles.title}}">Archive user</div>
		</div>
	</tokk-modal-header>

	<tokk-modal-content>
		<div class="{{::vm.styles.confirmationMessage}}">
			Are you sure you want to archive <span class="{{::vm.styles.bold}}">{{::vm.user.first_name}} {{::vm.user.last_name}}</span>?
		</div>
	</tokk-modal-content>

	<tokk-modal-footer>
		<tokk-button 
            class="{{::vm.styles.button}}" 
			text="Archive user" 
			type="primary" 
			ng-click="vm.archive(vm.user)">
		</tokk-button>

		<tokk-button 
            class="{{::vm.styles.button}}" 
			text="Cancel" 
			type="secondary" 
			ng-click="vm.close()">
		</tokk-button>
	</tokk-modal-footer>

</tokk-modal>

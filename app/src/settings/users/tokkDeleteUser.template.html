<span class="icon-trash {{::vm.styles.icon}}" ng-click="vm.open()">
    <tokk-tooltip ng-show="!vm.opened" message="Delete user" vdistance="40px"></tokk-tooltip>
</span>

<tokk-modal class="{{::vm.styles.modal}}" opened="vm.opened" close="vm.close()" width="460px">

	<tokk-modal-header>
		<div class="{{::vm.styles.titleContainer}}">
			<div class="{{::vm.styles.title}}">Delete user</div>
		</div>
	</tokk-modal-header>

	<tokk-modal-content>
		<div class="{{::vm.styles.confirmationMessage}}">
            All data from this user will be permanently removed.<br />
			Are you sure you want to delete <span class="{{::vm.styles.bold}}">{{::vm.user.first_name}} {{::vm.user.last_name}}</span>?
		</div>
	</tokk-modal-content>

	<tokk-modal-footer>
		<tokk-button 
            class="{{::vm.styles.button}}" 
			text="Delete user" 
			type="primary" 
            layout="red" 
			ng-click="vm.delete(vm.user)">
		</tokk-button>

		<tokk-button 
            class="{{::vm.styles.button}}" 
			text="Cancel" 
			type="secondary" 
			ng-click="vm.close()">
		</tokk-button>
	</tokk-modal-footer>

</tokk-modal>

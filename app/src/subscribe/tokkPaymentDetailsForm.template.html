		</div>

		<tokk-error visible="vm.noCardNumber" 
					message="vm.noCardNumberMessage" 
					padding-top="5px" 
					padding-bottom="0px">
		</tokk-error>

		<tokk-error visible="vm.invalidCardNumber" 
					message="vm.invalidCardNumberMessage" 
					padding-top="5px" 
					padding-bottom="0px">
		</tokk-error>

		<tokk-error visible="vm.unsupportedCard" 
					message="vm.unsupportedCardMessage" 
					padding-top="5px" 
					padding-bottom="0px">
		</tokk-error>
	</div>

	<div class="{{::vm.styles.line}}">
		<tokk-label>Name on card</tokk-label>

		<tokk-input>
			<input type="text" 
					autocomplete="cc-name" 
					ng-model="vm.cardholderName"
					ng-change="vm.resetCardholderNameValidation()" />
		</tokk-input>

		<tokk-error visible="vm.noCardholderName" 
					message="vm.noCardholderNameMessage" 
					padding-top="5px" 
					padding-bottom="0px">
		</tokk-error>
	</div>

	<div class="{{::vm.styles.line}} {{::vm.styles.lineExpirationCVC}}">
		<div class="{{::vm.styles.expiration}}">
			<tokk-label>Expiry</tokk-label>

			<div class="{{::vm.styles.inner}}">
				<div class="{{::vm.styles.expMonth}}">
					<tokk-select>
						<select ng-model="vm.expMonth"
								ng-options="month for month in vm.months track by month"
								ng-change="vm.resetExpiryValidation();">
							<option value="" default selected disabled>Month</option>
						</select>
					</tokk-select>
				</div>

				<div class="{{::vm.styles.separator}}">
					<span>/</span>
				</div>

				<div class="{{::vm.styles.expYear}}">
					<tokk-select>
						<select ng-model="vm.expYear"
								ng-options="year for year in vm.years track by year"
								ng-change="vm.resetExpiryValidation();">
							<option value="" default selected disabled>Year</option>
						</select>
					</tokk-select>
				</div>
			</div>

			<tokk-error visible="vm.noExpiry" 
						message="vm.noExpiryMessage" 
						padding-top="5px" 
						padding-bottom="0px">

			<tokk-error visible="vm.invalidExpiry" 
						message="vm.invalidExpiryMessage"

		<div class="{{::vm.styles.CVC}}">

			<tokk-input>

						autocomplete="cc-csc" 
						ng-model="vm.CVC"
						ng-change="vm.resetCVCValidation()" />

			<tokk-error visible="vm.noCVC" 
						message="vm.noCVCMessage" 
						padding-top="5px"

			<tokk-error visible="vm.invalidCVC"

		</div>
	</div>

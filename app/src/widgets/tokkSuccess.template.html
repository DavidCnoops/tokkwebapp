<div ng-if="vm.visible" class="animationError {{::vm.styles.container}}">

    <div class="{{::vm.styles.padding}}" ng-style="{'height': vm.paddingTop}"></div>

    <div class="{{::vm.styles.message}}">

        <span class="icon-done {{::vm.styles.icon}}"></span>

        <span class="{{::vm.styles.text}}">{{vm.message}}</span>

    </div>

    <div class="{{::vm.styles.padding}}" ng-style="{'height': vm.paddingBottom}"></div>

</div>
